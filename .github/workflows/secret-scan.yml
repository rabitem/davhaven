# Secret scanning: gitleaks over the full history of every pull request, of main and once a week (new rules find old
# commits). The rules are the gitleaks defaults; `.gitleaks.toml` exempts the deterministic test values of the repository,
# each with its reason. A finding fails the job and is printed redacted.
#
# gitleaks comes from its GitHub release, checked against the SHA-256 below before it runs (the release publishes a
# checksum file; the digest here is copied from it). The job runs in the Rust image of ci.yml (one digest per image), on
# the runners of every other job (vars.CI_RUNS_ON, GitHub-hosted for forks, Dependabot and repositories without the
# variable; ENGINEERING_RULES R18).
name: Secret scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GITLEAKS_VERSION: 8.24.3
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]' || github.actor == 'dependabot[bot]') && '["ubuntu-latest"]' || vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: rust:1.99.1-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b
      options: --cpus 1 --memory 1g --memory-swap 1g --cpu-shares 256 --oom-score-adj 500 --pids-limit 512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the history
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
