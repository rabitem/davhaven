schema_version: 1
name: python-caldav-invite-external
description: >
  The python caldav library uploads a meeting with a guest outside the tenant: the write succeeds, the organizer's
  copy records that the invitation was queued or mailed (iMIP), nothing is written for the guest on this server, and
  deleting the meeting cancels it.
client: python-caldav
feature: invite-external
origin: synthetic
provenance: >
  The organizer's object as The python caldav library writes a meeting with an attendee whose address belongs to no
  principal (PRODID -//python-caldav//caldav//EN); no capture of a deployed instance yet. The mail itself is covered
  by the scheduling matrix.
actors:
  olivia: owner
variables:
  cal: /dav/calendars/{{tenant}}/olivia/personal
steps:
  - name: the meeting with a guest is uploaded
    as: olivia
    request:
      method: PUT
      path: "{{cal}}/py-external.ics"
      headers: { If-None-Match: "*", Content-Type: "text/calendar; charset=utf-8" }
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//python-caldav//caldav//EN
        BEGIN:VEVENT
        UID:py-external-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270322T130000Z
        DTEND:20270322T140000Z
        SUMMARY:Kundentermin
        ORGANIZER:mailto:olivia@{{login_domain}}
        ATTENDEE;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:guest@example.net
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 201
      headers:
        schedule-tag: {}

  - name: the organizer's copy records what happened to the invitation
    as: olivia
    request:
      method: GET
      path: "{{cal}}/py-external.ics"
    expect:
      status: 200
      ical_contains: ["SCHEDULE-STATUS=1.", ":mailto:guest@example.net"]
      ical_excludes: ["SCHEDULE-STATUS=5."]

  - name: a second upload with a changed time keeps the state of the guest
    as: olivia
    request:
      method: PUT
      path: "{{cal}}/py-external.ics"
      headers: { Content-Type: "text/calendar; charset=utf-8" }
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//python-caldav//caldav//EN
        BEGIN:VEVENT
        UID:py-external-1@example.org
        DTSTAMP:20270101T000000Z
        SEQUENCE:1
        DTSTART:20270322T140000Z
        DTEND:20270322T150000Z
        SUMMARY:Kundentermin
        ORGANIZER:mailto:olivia@{{login_domain}}
        ATTENDEE;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:guest@example.net
        END:VEVENT
        END:VCALENDAR
    expect:
      status: [200, 204]

  - name: the meeting is cancelled by deleting it
    as: olivia
    request:
      method: DELETE
      path: "{{cal}}/py-external.ics"
    expect:
      status: 204
