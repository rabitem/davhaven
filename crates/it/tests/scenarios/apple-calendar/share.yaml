schema_version: 1
name: apple-calendar-share
description: >
  Calendar on macOS shares a calendar with a colleague with CalendarServer sharing: the owner posts CS:share, the
  colleague finds the invitation in the notification collection, accepts it with CS:invite-reply and gets the calendar
  as a binding in the home, and the owner is told that it was accepted.
client: apple-calendar
feature: share
origin: synthetic
provenance: >
  Documents as Calendar on macOS exchanges them for sharing (testdata/dav/sharing, reconstructed from the
  CalendarServer sharing specification and public traces); no capture of a deployed instance yet.
actors:
  olivia: owner
  otto: other_user
variables:
  home: /dav/calendars/{{tenant}}/olivia
  mine: /dav/calendars/{{tenant}}/otto
steps:
  - name: the owner shares the calendar read-write with a colleague
    as: olivia
    request:
      method: POST
      path: "{{home}}/projects/"
      headers: { Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="UTF-8"?>
        <CS:share xmlns:CS="http://calendarserver.org/ns/">
          <CS:set>
            <D:href xmlns:D="DAV:">mailto:otto@{{login_domain}}</D:href>
            <CS:common-name>Otto Other</CS:common-name>
            <CS:summary>Projects</CS:summary>
            <CS:read-write/>
          </CS:set>
        </CS:share>
    expect:
      status: 200

  - name: the colleague finds the invitation in the notification collection
    as: otto
    request:
      method: PROPFIND
      path: "{{mine}}/notifications/"
      headers: { Depth: "1", Content-Type: "application/xml; charset=utf-8" }
      body_file: dav/sharing/propfind-notifications.xml
    capture:
      notification: { xpath: "/{DAV:}multistatus/{DAV:}response[2]/{DAV:}href" }
    expect:
      status: 207

  - name: the invitation names the calendar and the access
    as: otto
    request:
      method: GET
      path: "{{notification}}"
    capture:
      invite: { xpath: "//{http://calendarserver.org/ns/}uid" }
    expect:
      status: 200
      body_contains: ["invite-notification", "read-write"]

  - name: the colleague accepts
    as: otto
    request:
      method: POST
      path: "{{mine}}/"
      headers: { Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="UTF-8"?>
        <CS:invite-reply xmlns:CS="http://calendarserver.org/ns/">
          <CS:invite-accepted/>
          <CS:hosturl><D:href xmlns:D="DAV:">{{home}}/projects/</D:href></CS:hosturl>
          <CS:in-reply-to>{{invite}}</CS:in-reply-to>
          <CS:summary>Projects</CS:summary>
        </CS:invite-reply>
    expect:
      status: 200
      xpath:
        - { path: "//{http://calendarserver.org/ns/}shared-as/{DAV:}href", contains: "{{mine}}/" }

  - name: the calendar is a binding in the home of the colleague
    as: otto
    request:
      method: PROPFIND
      path: "{{mine}}/"
      headers: { Depth: "1", Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="UTF-8"?>
        <A:propfind xmlns:A="DAV:"><A:prop><A:displayname/><A:resourcetype/></A:prop></A:propfind>
    expect:
      status: 207
      statuses:
        "{{mine}}/projects/": 200

  - name: the colleague can write in the shared calendar
    as: otto
    request:
      method: PUT
      path: "{{mine}}/projects/apple-share-1.ics"
      headers: { If-None-Match: "*" }
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//macOS 15.0//EN
        BEGIN:VEVENT
        UID:apple-share-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270319T090000Z
        DTEND:20270319T100000Z
        SUMMARY:Written by the sharee
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 201

  - name: the owner sees the event
    as: olivia
    request:
      method: GET
      path: "{{home}}/projects/apple-share-1.ics"
    expect:
      status: 200
      body_contains: ["Written by the sharee"]
