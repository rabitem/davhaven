schema_version: 1
name: davx5-invite-internal
description: >
  DAVx5 uploads a meeting with two attendees of the tenant: the server schedules it, the organizer's copy records the
  delivery to both, and the next refresh of an attendee finds the meeting as a copy of its own.
client: davx5
feature: invite-internal
origin: synthetic
provenance: >
  The organizer's object as DAVx5 writes a new meeting with attendees (PRODID +//IDN bitfire.at//DAVx5/4.4.2
  ical4j/3.2.19); the requests of the attendee are those of the client's refresh. The invitation is delivered by the
  server, not by the client.
actors:
  olivia: owner
  otto: other_user
  mia: group_member
variables:
  cal: /dav/calendars/{{tenant}}/olivia/personal
steps:
  - name: the meeting is uploaded
    as: olivia
    request:
      method: PUT
      path: "{{cal}}/davx5-invite.ics"
      headers: { If-None-Match: "*", Content-Type: "text/calendar;charset=utf-8", User-Agent: "DAVx5/4.4.2-ose (dav4jvm; okhttp/4.12.0)" }
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:+//IDN bitfire.at//DAVx5/4.4.2 ical4j/3.2.19
        BEGIN:VEVENT
        UID:davx5-invite-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270325T090000Z
        DTEND:20270325T100000Z
        SUMMARY:Planung
        ORGANIZER:mailto:olivia@{{login_domain}}
        ATTENDEE;ROLE=REQ-PARTICIPANT;PARTSTAT=NEEDS-ACTION;RSVP=TRUE;CN=Otto Other:mailto:otto@{{login_domain}}
        ATTENDEE;ROLE=REQ-PARTICIPANT;PARTSTAT=NEEDS-ACTION;RSVP=TRUE;CN=Mia Member:mailto:mia@{{login_domain}}
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 201
      headers:
        schedule-tag: {}

  - name: the organizer's copy records the delivery to both attendees
    as: olivia
    request:
      method: GET
      path: "{{cal}}/davx5-invite.ics"
    expect:
      status: 200
      ical_contains:
        - "SCHEDULE-STATUS=1.2:mailto:otto@{{login_domain}}"
        - "SCHEDULE-STATUS=1.2:mailto:mia@{{login_domain}}"

  - name: the colleague's next sync downloads the new copy
    as: otto
    request:
      method: REPORT
      path: /dav/calendars/{{tenant}}/otto/personal/
      headers: { Content-Type: "application/xml; charset=utf-8", User-Agent: "DAVx5/4.4.2-ose (dav4jvm; okhttp/4.12.0)" }
      body_file: dav/davx5-sync-collection.xml
    capture:
      copy: { xpath: "/{DAV:}multistatus/{DAV:}response/{DAV:}href" }
    expect:
      status: 207
      xpath:
        - { path: "/{DAV:}multistatus/{DAV:}response", count: 1 }

  - name: the copy is the meeting with the attendee's own state
    as: otto
    request:
      method: GET
      path: "{{copy}}"
    expect:
      status: 200
      headers:
        schedule-tag: {}
      ical_contains: ["UID:davx5-invite-1@example.org", "PARTSTAT=NEEDS-ACTION"]

  - name: the invitation is in the scheduling inbox of the second attendee
    as: mia
    request:
      method: PROPFIND
      path: /dav/calendars/{{tenant}}/mia/inbox/
      headers: { Depth: "1", Content-Type: "application/xml; charset=utf-8", User-Agent: "DAVx5/4.4.2-ose (dav4jvm; okhttp/4.12.0)" }
      body: |
        <?xml version="1.0" encoding="UTF-8"?>
        <D:propfind xmlns:D="DAV:"><D:prop><D:getetag/></D:prop></D:propfind>
    expect:
      status: 207
      xpath:
        - { path: "/{DAV:}multistatus/{DAV:}response", count: 2 }
