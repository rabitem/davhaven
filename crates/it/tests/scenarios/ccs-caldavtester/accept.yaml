schema_version: 1
name: ccs-caldavtester-accept
description: >
  The PARTSTAT tests of the CalendarServer test suite: an attendee answers with a PUT of its copy that is conditional on
  the Schedule-Tag it read, the organizer's copy shows the answer, an answer that is based on a Schedule-Tag from before
  an organizer change is refused with 412, and the attendee may not change what belongs to the organizer.
client: ccs-caldavtester
feature: accept
origin: synthetic
provenance: >
  Written after scripts/tests/CalDAV/schedule-attendee-changes and implicit/ (If-Schedule-Tag-Match, PARTSTAT changes,
  attendee changes that are not allowed) of ccs-caldavtester (see NOTICE).
actors:
  olivia: owner
  otto: other_user
variables:
  cal: /dav/calendars/{{tenant}}/olivia/personal
  mine: /dav/calendars/{{tenant}}/otto/personal
steps:
  - name: the organizer invites the attendee
    as: olivia
    request:
      method: PUT
      path: "{{cal}}/ccs-accept.ics"
      headers: { If-None-Match: "*" }
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//CalendarServer tests//EN
        BEGIN:VEVENT
        UID:ccs-accept-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270409T090000Z
        DTEND:20270409T100000Z
        SUMMARY:Answer me
        ORGANIZER;CN=Olivia Owner:mailto:olivia@{{login_domain}}
        ATTENDEE;CN=Otto Other;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:otto@{{login_domain}}
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 201

  - name: the attendee finds the copy and reads its Schedule-Tag
    as: otto
    request:
      method: REPORT
      path: "{{mine}}/"
      headers: { Depth: "1", Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="utf-8" ?>
        <C:calendar-query xmlns:D="DAV:" xmlns:C="urn:ietf:params:xml:ns:caldav">
          <D:prop><D:getetag/></D:prop>
          <C:filter><C:comp-filter name="VCALENDAR"><C:comp-filter name="VEVENT"/></C:comp-filter></C:filter>
        </C:calendar-query>
    capture:
      copy: { xpath: "/{DAV:}multistatus/{DAV:}response/{DAV:}href" }
    expect:
      status: 207

  - name: the Schedule-Tag is read
    as: otto
    request:
      method: GET
      path: "{{copy}}"
    capture:
      tag: { header: Schedule-Tag }
    expect:
      status: 200
      headers:
        schedule-tag: {}

  - name: the attendee may not change the time of the organizer's meeting
    as: otto
    request:
      method: PUT
      path: "{{copy}}"
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//CalendarServer tests//EN
        BEGIN:VEVENT
        UID:ccs-accept-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270409T150000Z
        DTEND:20270409T160000Z
        SUMMARY:Answer me
        ORGANIZER;CN=Olivia Owner:mailto:olivia@{{login_domain}}
        ATTENDEE;CN=Otto Other;PARTSTAT=ACCEPTED;RSVP=TRUE:mailto:otto@{{login_domain}}
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 403
      body_contains: ["allowed-attendee-scheduling-object-change"]

  - name: with the current Schedule-Tag the answer is merged and the time of the organizer stays
    as: otto
    request:
      method: PUT
      path: "{{copy}}"
      headers: { If-Schedule-Tag-Match: "{{tag}}" }
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//CalendarServer tests//EN
        BEGIN:VEVENT
        UID:ccs-accept-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270409T150000Z
        DTEND:20270409T160000Z
        SUMMARY:Answer me
        ORGANIZER;CN=Olivia Owner:mailto:olivia@{{login_domain}}
        ATTENDEE;CN=Otto Other;PARTSTAT=ACCEPTED;RSVP=TRUE:mailto:otto@{{login_domain}}
        END:VEVENT
        END:VCALENDAR
    expect:
      status: [200, 204]

  - name: the copy has the answer and the time of the organizer
    as: otto
    request:
      method: GET
      path: "{{copy}}"
    capture:
      tag2: { header: Schedule-Tag }
    expect:
      status: 200
      ical_contains: ["PARTSTAT=ACCEPTED", "DTSTART:20270409T090000Z"]
      ical_excludes: ["DTSTART:20270409T150000Z"]

  - name: the organizer's copy shows the answer
    as: olivia
    request:
      method: GET
      path: "{{cal}}/ccs-accept.ics"
    expect:
      status: 200
      ical_contains: ["PARTSTAT=ACCEPTED", "DTSTART:20270409T090000Z"]
      ical_excludes: ["PARTSTAT=NEEDS-ACTION"]

  - name: the organizer moves the meeting
    as: olivia
    request:
      method: PUT
      path: "{{cal}}/ccs-accept.ics"
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//CalendarServer tests//EN
        BEGIN:VEVENT
        UID:ccs-accept-1@example.org
        DTSTAMP:20270102T000000Z
        SEQUENCE:1
        DTSTART:20270409T100000Z
        DTEND:20270409T110000Z
        SUMMARY:Answer me
        ORGANIZER;CN=Olivia Owner:mailto:olivia@{{login_domain}}
        ATTENDEE;CN=Otto Other;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:otto@{{login_domain}}
        END:VEVENT
        END:VCALENDAR
    expect:
      status: [200, 204]

  - name: an answer that is based on the Schedule-Tag from before the move is refused
    as: otto
    request:
      method: PUT
      path: "{{copy}}"
      headers: { If-Schedule-Tag-Match: "{{tag2}}" }
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//CalendarServer tests//EN
        BEGIN:VEVENT
        UID:ccs-accept-1@example.org
        DTSTAMP:20270102T000000Z
        SEQUENCE:1
        DTSTART:20270409T100000Z
        DTEND:20270409T110000Z
        SUMMARY:Answer me
        ORGANIZER;CN=Olivia Owner:mailto:olivia@{{login_domain}}
        ATTENDEE;CN=Otto Other;PARTSTAT=DECLINED;RSVP=TRUE:mailto:otto@{{login_domain}}
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 412
