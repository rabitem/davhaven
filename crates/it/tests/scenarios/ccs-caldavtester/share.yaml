schema_version: 1
name: ccs-caldavtester-share
description: >
  The calendar sharing tests of the CalendarServer test suite: the owner shares read-only, the invitation shows in the
  owner's CS:invite property as not yet answered, the sharee accepts and the property shows it, a write by the sharee is
  refused, the owner raises the access to read-write and the write succeeds, and when the sharee deletes its binding
  the calendar and its events stay with the owner.
client: ccs-caldavtester
feature: share
origin: synthetic
provenance: >
  Written after scripts/tests/CalDAV/sharing/calendars (shared calendar invitations, read-write and read-only access,
  removal of a binding by the sharee) of ccs-caldavtester (see NOTICE); the documents are those of testdata/dav/sharing.
actors:
  olivia: owner
  otto: other_user
variables:
  home: /dav/calendars/{{tenant}}/olivia
  mine: /dav/calendars/{{tenant}}/otto
steps:
  - name: the owner shares the calendar read-only
    as: olivia
    request:
      method: POST
      path: "{{home}}/projects/"
      headers: { Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="utf-8" ?>
        <CS:share xmlns:CS="http://calendarserver.org/ns/">
          <CS:set>
            <D:href xmlns:D="DAV:">mailto:otto@{{login_domain}}</D:href>
            <CS:summary>Projects</CS:summary>
            <CS:read/>
          </CS:set>
        </CS:share>
    expect:
      status: 200

  - name: the owner's calendar lists the invitation as not yet answered
    as: olivia
    request:
      method: PROPFIND
      path: "{{home}}/projects/"
      headers: { Depth: "0", Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="utf-8" ?>
        <D:propfind xmlns:D="DAV:" xmlns:CS="http://calendarserver.org/ns/"><D:prop><CS:invite/></D:prop></D:propfind>
    expect:
      status: 207
      xpath:
        - { path: "//{http://calendarserver.org/ns/}invite/{http://calendarserver.org/ns/}user/{http://calendarserver.org/ns/}invite-noresponse" }

  - name: the sharee finds the invitation
    as: otto
    request:
      method: PROPFIND
      path: "{{mine}}/notifications/"
      headers: { Depth: "1", Content-Type: "application/xml; charset=utf-8" }
      body_file: dav/sharing/propfind-notifications.xml
    capture:
      notification: { xpath: "/{DAV:}multistatus/{DAV:}response[2]/{DAV:}href" }
    expect:
      status: 207

  - name: the notification carries the identifier to answer
    as: otto
    request:
      method: GET
      path: "{{notification}}"
    capture:
      invite: { xpath: "//{http://calendarserver.org/ns/}uid" }
    expect:
      status: 200

  - name: the sharee accepts
    as: otto
    request:
      method: POST
      path: "{{mine}}/"
      headers: { Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="utf-8" ?>
        <CS:invite-reply xmlns:CS="http://calendarserver.org/ns/">
          <CS:invite-accepted/>
          <CS:hosturl><D:href xmlns:D="DAV:">{{home}}/projects/</D:href></CS:hosturl>
          <CS:in-reply-to>{{invite}}</CS:in-reply-to>
        </CS:invite-reply>
    expect:
      status: 200

  - name: the owner's calendar lists the invitation as accepted
    as: olivia
    request:
      method: PROPFIND
      path: "{{home}}/projects/"
      headers: { Depth: "0", Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="utf-8" ?>
        <D:propfind xmlns:D="DAV:" xmlns:CS="http://calendarserver.org/ns/"><D:prop><CS:invite/></D:prop></D:propfind>
    expect:
      status: 207
      xpath:
        - { path: "//{http://calendarserver.org/ns/}invite/{http://calendarserver.org/ns/}user/{http://calendarserver.org/ns/}invite-accepted" }

  - name: the sharee cannot write with read access
    as: otto
    request:
      method: PUT
      path: "{{mine}}/projects/ccs-share-1.ics"
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//CalendarServer tests//EN
        BEGIN:VEVENT
        UID:ccs-share-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270410T090000Z
        DTEND:20270410T100000Z
        SUMMARY:By the sharee
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 403
      body_contains: ["need-privileges"]

  - name: the owner raises the access to read-write
    as: olivia
    request:
      method: POST
      path: "{{home}}/projects/"
      headers: { Content-Type: "application/xml; charset=utf-8" }
      body: |
        <?xml version="1.0" encoding="utf-8" ?>
        <CS:share xmlns:CS="http://calendarserver.org/ns/">
          <CS:set>
            <D:href xmlns:D="DAV:">mailto:otto@{{login_domain}}</D:href>
            <CS:read-write/>
          </CS:set>
        </CS:share>
    expect:
      status: 200

  - name: the sharee can write now
    as: otto
    request:
      method: PUT
      path: "{{mine}}/projects/ccs-share-1.ics"
      ical: |
        BEGIN:VCALENDAR
        VERSION:2.0
        PRODID:-//Apple Inc.//CalendarServer tests//EN
        BEGIN:VEVENT
        UID:ccs-share-1@example.org
        DTSTAMP:20270101T000000Z
        DTSTART:20270410T090000Z
        DTEND:20270410T100000Z
        SUMMARY:By the sharee
        END:VEVENT
        END:VCALENDAR
    expect:
      status: 201

  - name: the sharee deletes its binding
    as: otto
    request:
      method: DELETE
      path: "{{mine}}/projects/"
    expect:
      status: 204

  - name: the calendar and the event stay with the owner
    as: olivia
    request:
      method: GET
      path: "{{home}}/projects/ccs-share-1.ics"
    expect:
      status: 200
      body_contains: ["SUMMARY:By the sharee"]
