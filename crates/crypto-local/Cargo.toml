# server (its own tests do, as a dev-dependency).
testing = []

[dependencies]
davhaven-domain.workspace = true
davhaven-ports.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
hkdf.workspace = true
hmac.workspace = true
ring.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
davhaven-port-tests.workspace = true
davhaven-ports = { workspace = true, features = ["testing"] }
proptest.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
