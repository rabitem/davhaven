<!doctype html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f3f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f3f5;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border:1px solid #d9dee3;border-radius:6px;font-family:Arial,Helvetica,sans-serif;color:#1f2933;font-size:16px;line-height:1.5;">
<tr><td style="padding:24px 28px 8px 28px;">
{% block content %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 28px 24px 28px;border-top:1px solid #e4e7eb;font-size:13px;line-height:1.5;color:#52606d;">
{% include "_footer." ~ locale ~ ".html" %}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
